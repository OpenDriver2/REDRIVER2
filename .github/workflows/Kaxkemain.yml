name: REDRIVER2 PortMaster Build (RK3326 / AArch64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GL4ES_VERSION: v1.1.4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU for AArch64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Build Unified AArch64 Environment
        run: |
          set -euo pipefail
          cat << 'EOF' > Dockerfile
          FROM --platform=linux/arm64 ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
              build-essential cmake git ca-certificates pkg-config \
              libsdl2-dev libopenal-dev libjpeg-dev \
              libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev libx11-dev \
              && rm -rf /var/lib/apt/lists/*
          WORKDIR /workspace
          EOF
          docker build -t redriver2-aarch64 -f Dockerfile .

      - name: Generate Makefiles with Premake5
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz -o /tmp/premake5.tar.gz
          mkdir -p /tmp/premake_bin
          tar -xzf /tmp/premake5.tar.gz -C /tmp/premake_bin
          chmod +x /tmp/premake_bin/premake5
          cd src_rebuild
          
          sed -i 's/"x86"/"ARM64"/g' premake5.lua
          /tmp/premake_bin/premake5 gmake2

      - name: Cache gl4es build
        id: gl4es-cache
        uses: actions/cache@v4
        with:
          path: prebuilt_libs
          key: gl4es-${{ env.GL4ES_VERSION }}-aarch64-v2

      - name: Compile GL4ES (AArch64)
        if: steps.gl4es-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p prebuilt_libs
          docker run --rm --platform linux/arm64 -v "${{ github.workspace }}:/workspace" redriver2-aarch64 bash -c '
            git clone --branch "${{ env.GL4ES_VERSION }}" --depth 1 https://github.com/ptitSeb/gl4es.git /tmp/gl4es
            cd /tmp/gl4es
            mkdir build && cd build
            cmake .. -DCMAKE_SYSTEM_NAME=Linux -DSTATICLIB=OFF -DNOX11=ON -DGBM=ON -DDEFAULT_ES=2
            make -j$(nproc)
            cp ../lib/libGL.so.1 /workspace/prebuilt_libs/libgl4es.so
          '

      - name: Compile REDRIVER2 in AArch64 Container
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 -v "${{ github.workspace }}:/workspace" redriver2-aarch64 bash -c '
            set -euo pipefail
            echo "===== Kompiliere REDRIVER2 (AArch64) ====="
            
            find . -path ./.git -prune -o -type f -print0 \
              | xargs -0 grep -IlZ "" 2>/dev/null \
              | xargs -0 -r sed -i \
                  -e "s/__asm__(\"int3\")/__builtin_trap()/g" \
                  -e "s/asm(\"int3\")/__builtin_trap()/g"

            cd src_rebuild
            export CFLAGS="-O3 -pipe -fno-strict-aliasing"
            export CXXFLAGS="${CFLAGS}"

            cd build
            if make config=release_arm64 -j$(nproc); then
              echo "release_arm64 Config erfolgreich gebaut."
            else
              echo "::error::make config=release_arm64 fehlgeschlagen."
              exit 1
            fi
          '

      - name: Package PortMaster Artifact
        run: |
          set -euo pipefail
          mkdir -p dist/redriver2

          echo "===== Paketiere Dateien für PortMaster ====="
          BIN=$(find src_rebuild -iname "*redriver2*" -type f -executable | head -n1)
          if [ -z "${BIN}" ]; then
            echo "::error::Keine kompilierte Binary gefunden."
            exit 1
          fi
          cp "${BIN}" dist/redriver2/redriver2
          chmod +x dist/redriver2/redriver2

          cp prebuilt_libs/libgl4es.so dist/redriver2/

          for item in data assets configs shaders *.ini *.cfg; do
            if [ -e "$item" ]; then
              cp -r "$item" dist/redriver2/
            fi
          done

          cat << 'EOF_JSON' > dist/redriver2/port.json
          {
            "version": 2,
            "name": "redriver2.zip",
            "items": [
              "Redriver2.sh",
              "redriver2/"
            ],
            "items_opt": null,
            "attr": {
              "title": "Driver 2 (Redriver2)",
              "desc": "Der Open-Source Driver 2 PC Port fuer Linux Handhelds.",
              "inst": "Bereit zum Starten.",
              "genres": ["action", "driving"],
              "porter": ["St0len-One"],
              "rtr": true,
              "runtime": null,
              "reqs": [],
              "arch": ["aarch64"]
            }
          }
          EOF_JSON

          cat << 'EOF_SH' > dist/Redriver2.sh
          #!/bin/bash
          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}
          
          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/roms/tools/PortMaster/" ]; then
            controlfolder="/roms/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi
          
          source "$controlfolder/control.txt"
          source "$controlfolder/device_info.txt"
          
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"
          
          get_controls
          
          GAMEDIR="/$directory/ports/redriver2"
          cd "$GAMEDIR"
          exec > >(tee "$GAMEDIR/redriver2_debug.log") 2>&1
          
          export SDL_GAMECONTROLLERCONFIG="$sdl_controllerconfig"
          export LD_LIBRARY_PATH="$GAMEDIR:$LD_LIBRARY_PATH"
          export LIBGL_FB=2
          export LD_PRELOAD="$GAMEDIR/libgl4es.so"

          echo "Starte Redriver2..."
          $GPTOKEYB "redriver2" -c "$GAMEDIR/redriver2.gptk" &
          ./redriver2
          
          $ESUDO kill -9 $(pidof gptokeyb)
          $ESUDO systemctl restart oga_events &
          printf "\033c" > /dev/tty0
          EOF_SH
          chmod +x dist/Redriver2.sh

          cat << 'EOF_GPTK' > dist/redriver2/redriver2.gptk
          back = esc
          start = enter
          up = up
          down = down
          left = left
          right = right
          left_analog_up = up
          left_analog_down = down
          left_analog_left = left
          left_analog_right = right
          right_analog_up = up
          right_analog_down = down
          right_analog_left = left
          right_analog_right = right
          a = space
          b = alt
          x = ctrl
          y = shift
          l1 = q
          r1 = e
          l2 = tab
          r2 = enter
          EOF_GPTK

      - name: Upload PortMaster Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REDRIVER2-PortMaster
          path: dist/
          if-no-files-found: error
