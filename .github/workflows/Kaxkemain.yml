name: REDRIVER2 PortMaster Build (RK3326)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate Makefiles with Premake5
        run: |
          curl -L https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz -o /tmp/premake5.tar.gz
          mkdir -p /tmp/premake_bin
          tar -xzf /tmp/premake5.tar.gz -C /tmp/premake_bin
          chmod +x /tmp/premake_bin/premake5
          cd src_rebuild
          sed -i 's/"x86"/"ARM"/g' premake5.lua
          /tmp/premake_bin/premake5 gmake2

      - name: Cross-Compile GL4ES on Host (Bypass QEMU CMake Bug)
        run: |
          echo "===== Kompiliere GL4ES nativ auf dem Host ====="
          
          # Fix: armhf Architektur für saubere Header-Auflösung hinzufügen
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          
          # Fix: libx11-dev:armhf hinzugefügt, damit EGL seine Datentypen findet
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf cmake git libx11-dev:armhf
          
          git clone --branch v1.1.4 --depth 1 https://github.com/ptitSeb/gl4es.git /tmp/gl4es
          mkdir -p /tmp/gl4es/build && cd /tmp/gl4es/build
          
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DSTATICLIB=OFF \
            -DNOX11=ON \
            -DDEFAULT_ES=2
            
          make -j$(nproc)
          
          mkdir -p ${{ github.workspace }}/prebuilt_libs
          cp lib/libgl4es.so ${{ github.workspace }}/prebuilt_libs/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7

      - name: Build ARM32 Environment
        run: |
          cat << 'EOF' > Dockerfile
          FROM --platform=linux/arm/v7 ubuntu:20.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
              build-essential gcc g++ libsdl2-dev libopenal-dev \
              libjpeg-dev libgl1-mesa-dev libgles2-mesa-dev pkg-config \
              && rm -rf /var/lib/apt/lists/*
          WORKDIR /workspace
          EOF
          docker build -t redriver2-armhf -f Dockerfile .

      - name: Compile Game and Package Artifact
        run: |
          docker run --rm --platform linux/arm/v7 -v "${{ github.workspace }}:/workspace" -w /workspace redriver2-armhf bash -c "
            set -e
            
            echo '===== Kompiliere REDRIVER2 im Container ====='
            find . -type f -exec sed -i 's/__asm__(\"int3\")/__builtin_trap()/g' {} +
            find . -type f -exec sed -i 's/asm(\"int3\")/__builtin_trap()/g' {} +
            
            cd src_rebuild
            export CFLAGS='-mcpu=cortex-a35 -mfpu=neon-fp-armv8 -mfloat-abi=hard -O3 -pipe -fno-strict-aliasing'
            export CXXFLAGS='-mcpu=cortex-a35 -mfpu=neon-fp-armv8 -mfloat-abi=hard -O3 -pipe -fno-strict-aliasing'
            
            cd build
            make config=release_arm -j2 || make -j2
            
            cd /workspace
            mkdir -p dist/redriver2
            
            echo '===== Paketiere Dateien ====='
            find src_rebuild -iname '*redriver2*' -type f -executable -exec cp {} dist/redriver2/redriver2 \;
            
            cp prebuilt_libs/libgl4es.so dist/redriver2/
            
            if [ -d 'DRIVER2' ]; then cp -r DRIVER2 dist/redriver2/; fi
            if [ -d 'driver2' ]; then cp -r driver2 dist/redriver2/; fi
            cp -f config.ini dist/redriver2/ 2>/dev/null || true
            
            echo 'Fertiger Inhalt des Release-Ordners:'
            ls -la dist/redriver2/
          "

      - name: Upload PortMaster Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REDRIVER2-PortMaster
          path: dist/redriver2/
