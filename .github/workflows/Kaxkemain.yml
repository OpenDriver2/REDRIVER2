name: REDRIVER2 PortMaster Build (RK3326)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  TARGET_CPU: cortex-a35
  TARGET_FPU: neon-fp-armv8
  GL4ES_VERSION: v1.1.4

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate Makefiles with Premake5
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz -o /tmp/premake5.tar.gz
          mkdir -p /tmp/premake_bin
          tar -xzf /tmp/premake5.tar.gz -C /tmp/premake_bin
          chmod +x /tmp/premake_bin/premake5
          cd src_rebuild
          sed -i 's/"x86"/"ARM"/g' premake5.lua
          /tmp/premake_bin/premake5 gmake2

      - name: Cache gl4es build
        id: gl4es-cache
        uses: actions/cache@v4
        with:
          path: prebuilt_libs
          key: gl4es-${{ env.GL4ES_VERSION }}-${{ env.TARGET_CPU }}-focal-armhf-nogbm-v5

      - name: Cross-Compile GL4ES without GBM (Standard ArkOS Mode)
        if: steps.gl4es-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p prebuilt_libs

          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e GL4ES_VERSION="${GL4ES_VERSION}" \
            ubuntu:20.04 bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              echo "===== Konfiguriere ARMhf Quellen ====="
              dpkg --add-architecture armhf
              cp /etc/apt/sources.list /etc/apt/sources.list.bak
              cat > /etc/apt/sources.list << EOF
              deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ focal main restricted universe multiverse
              deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ focal-updates main restricted universe multiverse
              deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ focal-security main restricted universe multiverse

              deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ focal main restricted universe multiverse
              deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ focal-updates main restricted universe multiverse
              deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ focal-security main restricted universe multiverse
              EOF

              for i in 1 2 3; do
                apt-get update && break
                echo "apt-get update fehlgeschlagen, Versuch $i/3 ..."
                sleep 5
              done

              apt-get install -y --no-install-recommends \
                gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf cmake make git ca-certificates pkg-config \
                libx11-dev:armhf libegl1-mesa-dev:armhf libgles2-mesa-dev:armhf

              git clone --branch "${GL4ES_VERSION}" --depth 1 https://github.com/ptitSeb/gl4es.git /tmp/gl4es
              mkdir -p /tmp/gl4es/build && cd /tmp/gl4es/build

              export PKG_CONFIG_LIBDIR="/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig"
              export PKG_CONFIG_ALLOW_CROSS=1

              cmake .. \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=arm \
                -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
                -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
                -DSTATICLIB=OFF \
                -DNOX11=ON \
                -DGBM=OFF \
                -DDEFAULT_ES=2

              make -j"$(nproc)"

              BUILT_LIB=$(find /tmp/gl4es -name "libGL.so.1" -type f | head -n1)
              if [ -z "${BUILT_LIB}" ]; then
                echo "gl4es-Build hat keine libGL.so.1 erzeugt - Abbruch." >&2
                exit 1
              fi
              cp "${BUILT_LIB}" /workspace/prebuilt_libs/libgl4es.so
            '

      - name: Verify cached/prebuilt gl4es library exists
        run: |
          set -euo pipefail
          if [ ! -f prebuilt_libs/libgl4es.so ]; then
            echo "::error::prebuilt_libs/libgl4es.so fehlt."
            exit 1
          fi
          echo "gl4es-Lib gefunden: $(ls -la prebuilt_libs/libgl4es.so)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7

      - name: Build ARM32 Environment
        run: |
          set -euo pipefail
          cat << 'EOF' > Dockerfile
          FROM --platform=linux/arm/v7 ubuntu:20.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
              build-essential gcc g++ libsdl2-dev libopenal-dev \
              libjpeg-dev libgl1-mesa-dev libgles2-mesa-dev pkg-config \
              && rm -rf /var/lib/apt/lists/*
          WORKDIR /workspace
          EOF
          docker build -t redriver2-armhf -f Dockerfile .

      - name: Compile Game and Package Artifact
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm/v7 -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e TARGET_CPU="${TARGET_CPU}" -e TARGET_FPU="${TARGET_FPU}" \
            redriver2-armhf bash -c '
            set -euo pipefail

            echo "===== Kompiliere REDRIVER2 im Container ====="[cite: 4]
            find . -path ./.git -prune -o -type f -print0 \
              | xargs -0 grep -IlZ "" 2>/dev/null \
              | xargs -0 -r sed -i \
                  -e "s/__asm__(\"int3\")/__builtin_trap()/g" \
                  -e "s/asm(\"int3\")/__builtin_trap()/g"

            cd src_rebuild
            export CFLAGS="-mcpu=${TARGET_CPU} -mfpu=${TARGET_FPU} -mfloat-abi=hard -O3 -pipe -fno-strict-aliasing"
            export CXXFLAGS="${CFLAGS}"

            cd build
            if make config=release_arm -j2; then
              echo "release_arm Config erfolgreich gebaut."[cite: 4]
            else
              echo "::error::make config=release_arm fehlgeschlagen."[cite: 4]
              exit 1
            fi

            cd /workspace
            mkdir -p dist/redriver2

            echo "===== Durchsuche Repo und paketiere alle benötigten Dateien ====="
            BIN=$(find src_rebuild -iname "*redriver2*" -type f -executable | head -n1)
            [ -z "${BIN}" ] && { echo "::error::Keine Binary gefunden."; exit 1; }
            cp "${BIN}" dist/redriver2/redriver2
            chmod +x dist/redriver2/redriver2

            # 32-Bit libgl4es.so kopieren
            cp prebuilt_libs/libgl4es.so dist/redriver2/

            # Automatisches Durchsuchen des Repos nach allen Laufzeitordnern und Dateien (z.B. data, configs, assets)
            for item in data assets configs shaders *.ini *.cfg; do
              if [ -e "$item" ]; then
                cp -r "$item" dist/redriver2/
                echo "[+] Laufzeit-Element gefunden und kopiert: $item"
              fi
            done

            # 1. port.json erstellen
            cat << 'EOF_JSON' > dist/redriver2/port.json
            {
              "version": 2,
              "name": "redriver2.zip",
              "items": [
                "Redriver2.sh",
                "redriver2"
              ],
              "items_opt": null,
              "attr": {
                "title": "Driver 2 (Redriver2)",
                "desc": "Der Open-Source Driver 2 PC Port für Linux Handhelds.",
                "inst": "Bereit zum Starten.",
                "genres": ["action", "driving"],
                "porter": ["St0len-One"],
                "rtr": true,
                "runtime": null,
                "reqs": [],
                "arch": ["armhf"]
              }
            }
            EOF_JSON

            # 2. Perfektes PortMaster Start-Skript erstellen
            cat << 'EOF_SH' > dist/redriver2/Redriver2.sh
            #!/bin/bash
            XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}
            if [ -d "/opt/system/Tools/PortMaster/" ]; then
              controlfolder="/opt/system/Tools/PortMaster"
            elif [ -d "/roms/tools/PortMaster/" ]; then
              controlfolder="/roms/tools/PortMaster"
            elif [ -d "$XDG_DATA_HOME/PortMaster" ]; then
              controlfolder="$XDG_DATA_HOME/PortMaster"
            else
              controlfolder="/roms/ports/PortMaster"
            fi
            if [ -f "$controlfolder/funcs.txt" ]; then
              source "$controlfolder/funcs.txt"
            else
              echo "PortMaster funcs.txt nicht gefunden!" >&2
              exit 1
            fi
            pm_init
            GAMEDIR="/roms/ports/redriver2"
            cd "$GAMEDIR"
            exec > >(tee "$GAMEDIR/redriver2_debug.log") 2>&1
            if [ -f "${controlfolder}/libgl_${CFW_NAME}.txt" ]; then
              source "${controlfolder}/libgl_${CFW_NAME}.txt"
            else
              source "${controlfolder}/libgl_default.txt"
            fi
            export SDL_GAMECONTROLLERCONFIG="$sdl_controllerconfig"
            export LD_LIBRARY_PATH="$GAMEDIR/libs:$LD_LIBRARY_PATH"
            if [ -f "$GAMEDIR/libgl4es.so" ]; then
              export LIBGL_FB=2
              export LD_PRELOAD="$GAMEDIR/libgl4es.so"
            fi
            echo "Starte Redriver2 auf M9 Pro (ArkOS / RK3326)..."
            $GPTOKEYB "redriver2" -c "$GAMEDIR/redriver2.gptk" &
            ./redriver2
            pm_finish
            EOF_SH
            chmod +x dist/redriver2/Redriver2.sh

            # 3. Controller-Mapping (gptk) erstellen
            cat << 'EOF_GPTK' > dist/redriver2/redriver2.gptk
            back = esc
            start = enter
            up = up
            down = down
            left = left
            right = right
            left_analog_up = up
            left_analog_down = down
            left_analog_left = left
            left_analog_right = right
            right_analog_up = up
            right_analog_down = down
            right_analog_left = left
            right_analog_right = right
            a = space
            b = alt
            x = ctrl
            y = shift
            l1 = q
            r1 = e
            l2 = tab
            r2 = enter
            EOF_GPTK

            echo "Fertiger Inhalt des Release-Ordners:"
            ls -la dist/redriver2/
          '

      - name: Upload PortMaster Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REDRIVER2-PortMaster
          path: dist/redriver2/
          if-no-files-found: error
