name: Build second REDRIVER2 for R36S (RK3326)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate Makefiles with Premake5 on Host
        run: |
          echo "Downloading Premake5 for x86_64 Host..."
          curl -L https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz -o /tmp/premake5.tar.gz
          tar -xzf /tmp/premake5.tar.gz -C /tmp
          chmod +x /tmp/premake5
          
          cd src_rebuild
          # Architektur-Patches in premake5.lua
          sed -i 's/"x86_64"/"ARM64"/g' premake5.lua
          sed -i 's/"x86"/"ARM"/g' premake5.lua
          
          # Makefiles im korrekten 'build'-Ordner generieren
          /tmp/premake5 gmake2
          cd ..
          echo "Makefiles successfully generated on host!"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Build ARM64 Docker container image
        run: |
          cat << 'EOF' > Dockerfile
          FROM --platform=linux/arm64 ubuntu:22.04
          
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates \
              build-essential \
              make \
              gcc-9 \
              g++-9 \
              gfortran-9 \
              libsdl2-dev \
              libopenal-dev \
              libjpeg-dev \
              libgl1-mesa-dev \
              libgles2-mesa-dev \
              libxrandr-dev \
              libxinerama-dev \
              libxcursor-dev \
              libxi-dev \
              libglu1-mesa-dev \
              libpulse-dev \
              libdbus-1-dev \
              libibus-1.0-dev \
              pkg-config \
              cpio \
              wget \
              curl \
              && rm -rf /var/lib/apt/lists/*
          
          WORKDIR /workspace
          EOF

          docker build -t redriver2-arm64-builder -f Dockerfile .

      - name: Run build inside container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            redriver2-arm64-builder \
            bash -c "
              set -e
              echo '===== Build-Step: Kompilierung für RK3326 (arm64) ====='
              cd src_rebuild
              
              # Cortex-A35 Optimierungen und Memory-Sicherheit
              export CFLAGS='-mcpu=cortex-a35 -mtune=cortex-a35 -O3 -pipe -fno-strict-aliasing'
              export CXXFLAGS='-mcpu=cortex-a35 -mtune=cortex-a35 -O3 -pipe -fno-strict-aliasing'
              export LDFLAGS='-mcpu=cortex-a35'
              
              cd build
              # Durchprobieren der Config-Namen, falls Premake sie umbenannt hat
              make config=release_arm64 -j$(nproc) || \
              make config=release_dev_arm64 -j$(nproc) || \
              make config=release_dev_x64 -j$(nproc) || \
              make -j$(nproc)
              
              cd /workspace
              mkdir -p dist/REDRIVER2_arkos
              find src_rebuild -type f -name 'REDRIVER2' -exec cp {} dist/REDRIVER2_arkos/ \;
              echo 'SD-Karten-Struktur für ArkOS:' > dist/REDRIVER2_arkos/README.txt
              echo 'Lege die Binärdatei als /roms/ports/redriver2/redriver2 ab.' >> dist/REDRIVER2_arkos/README.txt
            "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REDRIVER2-arkos-arm64
          path: dist/REDRIVER2_arkos/
          if-no-files-found: error
