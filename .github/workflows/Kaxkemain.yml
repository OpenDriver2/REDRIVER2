name: krawild REDRIVER2 for R36S (RK3326)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate Makefiles with Premake5 on Host
        run: |
          curl -L https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz -o /tmp/premake5.tar.gz
          mkdir -p /tmp/premake_bin
          tar -xzf /tmp/premake5.tar.gz -C /tmp/premake_bin
          chmod +x /tmp/premake_bin/premake5
          
          cd src_rebuild
          sed -i 's/"x86"/"ARM"/g' premake5.lua
          /tmp/premake_bin/premake5 gmake2
          cd ..

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7

      - name: Build ARM32 (armhf) Container Image
        run: |
          cat << 'EOF' > Dockerfile
          FROM --platform=linux/arm/v7 ubuntu:20.04
          ENV DEBIAN_FRONTEND=noninteractive
          
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates build-essential make gcc-9 g++-9 cmake git \
              libsdl2-dev libopenal-dev libjpeg-dev libgl1-mesa-dev libgles2-mesa-dev \
              libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev pkg-config cpio wget curl \
              && rm -rf /var/lib/apt/lists/*
          WORKDIR /workspace
          EOF

          docker build -t redriver2-armhf-builder -f Dockerfile .

      - name: Run build inside container
        run: |
          docker run --rm \
            --platform linux/arm/v7 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            redriver2-armhf-builder \
            bash -c "
              set -e
              
              echo '===== 1. Kompiliere GL4ES Übersetzer-Bibliothek ====='
              git clone --depth 1 https://github.com/ptitSeb/gl4es.git /tmp/gl4es_build
              cd /tmp/gl4es_build
              mkdir build && cd build
              cmake .. -DSTATICLIB=OFF -DNOX11=ON -DDEFAULT_ES=2
              make -j2
              
              cd /workspace
              mkdir -p dist/REDRIVER2_arkos
              cp /tmp/gl4es_build/lib/libgl4es.so dist/REDRIVER2_arkos/
              
              echo '===== 2. Kompiliere REDRIVER2 ====='
              find . -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) -exec sed -i 's/__asm__(\"int3\")/__builtin_trap()/g' {} +
              find . -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) -exec sed -i 's/asm(\"int3\")/__builtin_trap()/g' {} +
              
              cd src_rebuild
              export CFLAGS='-mcpu=cortex-a35 -mfpu=neon-fp-armv8 -mfloat-abi=hard -O3 -pipe -fno-strict-aliasing'
              export CXXFLAGS='-mcpu=cortex-a35 -mfpu=neon-fp-armv8 -mfloat-abi=hard -O3 -pipe -fno-strict-aliasing'
              export LDFLAGS='-mcpu=cortex-a35 -mfpu=neon-fp-armv8 -mfloat-abi=hard'
              
              cd build
              make config=release_arm -j2 || make -j2
              
              cd /workspace
              echo '===== 3. Paketiere Artefakt ====='
              find src_rebuild -iname '*redriver2*' -type f -executable -exec cp {} dist/REDRIVER2_arkos/ \;
              
              if [ -d "DRIVER2" ]; then cp -r DRIVER2 dist/REDRIVER2_arkos/; fi
              if [ -d "driver2" ]; then cp -r driver2 dist/REDRIVER2_arkos/; fi
              cp -f config.ini dist/REDRIVER2_arkos/ 2>/dev/null || true
              
              ls -la dist/REDRIVER2_arkos/
            "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REDRIVER2-arkos-armhf
          path: dist/REDRIVER2_arkos/
          if-no-files-found: error
