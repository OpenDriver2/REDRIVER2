name: erstelle REDRIVER2 for R36S (RK3326)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Repository klonen
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. QEMU-Setup für ARM64-Emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      # 3. Docker Build & Run (ARM64-Container)
      - name: Build in ARM64 Docker container
        run: |
          # Docker-Image für ARM64 mit allen Abhängigkeiten erstellen
          cat > Dockerfile <<'EOF'
          FROM --platform=linux/arm64 ubuntu:22.04
          
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates \
              build-essential \
              make \
              gcc-9 \
              g++-9 \
              gfortran-9 \
              libsdl2-dev \
              libopenal-dev \
              libjpeg-dev \
              libgl1-mesa-dev \
              libgles2-mesa-dev \
              libxrandr-dev \
              libxinerama-dev \
              libxcursor-dev \
              libxi-dev \
              libglu1-mesa-dev \
              libpulse-dev \
              libdbus-1-dev \
              libibus-1.0-dev \
              pkg-config \
              cpio \
              wget \
              curl \
              && rm -rf /var/lib/apt/lists/*
          
          WORKDIR /workspace
          EOF

          docker build -t redriver2-arm64-builder -f Dockerfile .

      # 4. Build-Ausführung im Container
      - name: Run build inside container
        run: |
          # Repository in den Container mounten und Build durchführen
          docker run --rm \
            --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            redriver2-arm64-builder \
            bash -c "
              set -e

              echo '===== Build-Step: Cross-Compilation für RK3326 (arm64) ====='

              # Premake5 herunterladen (falls wget fehlschlägt, curl als Fallback, ggf. mit --insecure)
              echo 'Downloading Premake5...'
              if ! wget --no-check-certificate -q 'https://github.com/premake/premake-core/releases/download/v5.0.0-alpha15/premake-5.0.0-alpha15-linux.tar.gz' -O /tmp/premake5.tar.gz; then
                echo 'wget failed, trying curl...'
                curl -L --insecure 'https://github.com/premake/premake-core/releases/download/v5.0.0-alpha15/premake-5.0.0-alpha15-linux.tar.gz' -o /tmp/premake5.tar.gz
              fi
              tar -xzf /tmp/premake5.tar.gz -C /tmp
              cp /tmp/premake5 /usr/local/bin/
              chmod +x /usr/local/bin/premake5
              premake5 --version

              # Architektur-Patch
              echo 'Patching premake5.lua...'
              cd /workspace/src_rebuild
              sed -i 's/\"x86\"/\"ARM64\"/g' premake5.lua
              sed -i 's/\"x86_64\"/\"ARM64\"/g' premake5.lua
              grep -n 'platforms' premake5.lua | head -5

              # Premake5 Makefiles generieren
              echo 'Generating Makefiles...'
              premake5 gmake
              ls -la project_gmake_linux

              # Kompilierung mit aggressiven Optimierungen
              echo 'Building REDRIVER2...'
              export CFLAGS='-mcpu=cortex-a35 -mtune=cortex-a35 -O3 -pipe -fno-strict-aliasing'
              export CXXFLAGS='-mcpu=cortex-a35 -mtune=cortex-a35 -O3 -pipe -fno-strict-aliasing'
              export LDFLAGS='-mcpu=cortex-a35'

              cd project_gmake_linux
              make config=release_arm64 -j\$(nproc) || \
              make config=release_dev_arm64 -j\$(nproc) || \
              make -j\$(nproc)

              # Artefakt verpacken
              echo 'Packaging artifacts...'
              cd /workspace
              mkdir -p dist/REDRIVER2_arkos
              cp bin/Release/REDRIVER2 dist/REDRIVER2_arkos/ 2>/dev/null || \
              cp bin/Release_dev/REDRIVER2 dist/REDRIVER2_arkos/ 2>/dev/null || \
              cp bin/*/REDRIVER2 dist/REDRIVER2_arkos/ 2>/dev/null
              echo 'SD-Karten-Struktur für ArkOS:' > dist/REDRIVER2_arkos/README.txt
              echo 'Lege die Binärdatei als /roms/ports/redriver2/redriver2 ab.' >> dist/REDRIVER2_arkos/README.txt
              echo 'Lege die originalen PSX-Dateien (.cue/.bin) in denselben Ordner.' >> dist/REDRIVER2_arkos/README.txt
              ls -laR dist
            "

      # 5. Artefakt hochladen
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REDRIVER2-arkos-arm64
          path: dist/REDRIVER2_arkos/
          if-no-files-found: error
